name: Secure CI/CD Pipeline

on:
  pull_request:
    branches: [ "test" ]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar Requests
        run: pip install requests

      - name: Notificar Inicio
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/telegram_bot.py "🚀 Iniciando revisión de seguridad en PR #${{ github.event.number }}"

      - name: Ejecutar Modelo de Seguridad (Dummy)
        id: scan
        continue-on-error: true
        run: python scripts/dummy_scan.py

      # --- SI ES VULNERABLE ---
      - name: Gestionar Vulnerabilidad
        if: steps.scan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/telegram_bot.py "❌ ALERTA: Código VULNERABLE detectado. PR rechazado."
          gh pr comment ${{ github.event.number }} --body "⛔ **SEGURIDAD FALLIDA** \n\n El modelo detectó vulnerabilidades. Merge bloqueado."
          gh pr edit ${{ github.event.number }} --add-label "fixing-required"
          gh issue create --title "Vulnerabilidad en PR #${{ github.event.number }}" --body "Se detectó código inseguro. Revisar logs." --assignee ${{ github.actor }}
          gh pr close ${{ github.event.number }}
          exit 1

      # --- SI ES SEGURO ---
      - name: Notificar Éxito
        if: steps.scan.outcome == 'success'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/telegram_bot.py "✅ Código SEGURO. Procediendo a pruebas."

  merge-and-test:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Merge Automático a Test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.number }} --merge --auto
      
      - name: Ejecutar Pruebas Unitarias
        run: | 
          echo "Ejecutando pytest..."
          # pytest 

      - name: Notificar Tests
        if: success()
        env:
           TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
           TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/telegram_bot.py "✅ Pruebas unitarias pasadas en rama TEST."