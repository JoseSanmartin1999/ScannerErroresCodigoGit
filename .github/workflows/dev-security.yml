name: Dev - Detección de Vulnerabilidades

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Instalar Dependencias
        run: |
          pip install requests scikit-learn numpy

      - name: 📢 Notificar Inicio
        if: github.event_name == 'pull_request'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/telegram_bot.py "🚀 [DEV] Iniciando escaneo de seguridad en PR #${{ github.event.number }}" || echo "Telegram no configurado"

      - name: 🔍 Ejecutar Scanner de IA
        id: scan
        continue-on-error: true
        run: |
          chmod +x scripts/scan_with_ia.py
          python scripts/scan_with_ia.py

      # --- SI DETECTA VULNERABILIDAD ---
      - name: ❌ Gestionar Vulnerabilidad Detectada
        if: steps.scan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "⛔ VULNERABILIDAD DETECTADA - BLOQUEANDO MERGE"
          
          # Notificar por Telegram
          python scripts/telegram_bot.py "❌ [DEV] ALERTA: Código VULNERABLE detectado en PR #${{ github.event.number }}. Merge bloqueado." || echo "Notificación Telegram fallida"
          
          # Si es PR, comentar y etiquetar
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            gh pr comment ${{ github.event.number }} --body "⛔ **SEGURIDAD FALLIDA** 
            
            El modelo de IA detectó vulnerabilidades críticas en el código.
            
            ❌ El merge a TEST está **BLOQUEADO**.
            
            Por favor, corrija las vulnerabilidades y vuelva a hacer push." || echo "Comentario PR fallido"
            
            gh pr edit ${{ github.event.number }} --add-label "security-issue" || echo "Etiqueta fallida"
            
            # Crear issue
            gh issue create --title "🔒 Vulnerabilidad en PR #${{ github.event.number }}" \
              --body "Se detectó código inseguro en el PR. Revisar logs del workflow." \
              --assignee ${{ github.actor }} --label "security" || echo "Issue fallido"
          fi
          
          exit 1

      # --- SI EL CÓDIGO ES SEGURO ---
      - name: ✅ Código Seguro - Aprobar Merge
        if: steps.scan.outcome == 'success'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "✅ CÓDIGO SEGURO - APROBADO PARA TEST"
          python scripts/telegram_bot.py "✅ [DEV] Código SEGURO verificado. Listo para merge a TEST." || echo "Notificación Telegram fallida"

      - name: 🔀 Auto-merge a Test (si es PR)
        if: steps.scan.outcome == 'success' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Intentando auto-merge a test..."
          gh pr merge ${{ github.event.number }} --merge --auto || echo "Auto-merge no disponible, requiere aprobación manual"
