name: Main - Despliegue a Producción

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 📦 Instalar Dependencias
        run: |
          pip install requests

      - name: 📢 Notificar Inicio de Despliegue
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/telegram_bot.py "🚀 [MAIN] Iniciando despliegue a producción..." || echo "Telegram no configurado"

      - name: 🔧 Pre-Deploy: Verificación
        run: |
          echo "Verificando archivos de despliegue..."
          ls -la
          echo "Verificación completada ✓"

      - name: 🚀 Ejecutar Despliegue
        id: deploy
        continue-on-error: true
        run: |
          chmod +x scripts/deploy.py
          python scripts/deploy.py

      # --- SI EL DESPLIEGUE FALLA ---
      - name: ❌ Despliegue Fallido
        if: steps.deploy.outcome == 'failure'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "❌ DESPLIEGUE FALLIDO"
          python scripts/telegram_bot.py "❌ [MAIN] Despliegue FALLIDO. Revisar logs urgente." || echo "Notificación fallida"
          exit 1

      # --- SI EL DESPLIEGUE ES EXITOSO ---
      - name: ✅ Despliegue Exitoso
        if: steps.deploy.outcome == 'success'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "✅ DESPLIEGUE COMPLETADO CON ÉXITO"
          python scripts/telegram_bot.py "✅ [MAIN] Despliegue a PRODUCCIÓN completado exitosamente! 🎉" || echo "Notificación fallida"

      - name: 📊 Reporte de Despliegue
        if: always()
        run: |
          echo "================================"
          echo "REPORTE DE DESPLIEGUE"
          echo "================================"
          echo "Branch: main"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Status: ${{ steps.deploy.outcome }}"
          echo "================================"
